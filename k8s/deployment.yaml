apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
  namespace: hello-devops
  labels:
    app: hello-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-devops
  template:
    metadata:
      labels:
        app: hello-devops
    spec:
      # No imagePullSecrets - Docker Hub public repo, no auth needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-devops
          # CD replaces this tag with the commit SHA on every deploy.
          image: docker.io/marvin1198/hello-devops:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hello-devops-config
          resources:
            requests:
              memory: "96Mi"
              cpu: "20m"
            limits:
              memory: "192Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 2
