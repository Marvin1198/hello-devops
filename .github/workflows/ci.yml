name: CI

on:
  push:
    branches: 
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: marvin1198/hello-devops

jobs:
  # ------------------------------------------------------------------
  # 1. Unit tests + coverage. Everything else depends on this passing.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------
  # 2. Static analysis. Separate job so a Sonar outage cannot block
  #    the image pipeline.
  # ------------------------------------------------------------------
  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar needs full history for new-code detection

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate coverage for Sonar
        run: pytest

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ------------------------------------------------------------------
  # 3. Build -> scan -> gate -> push.
  #    Image is built into the local daemon and scanned BEFORE any push,
  #    so a failing gate means nothing reaches the registry.
  # ------------------------------------------------------------------
  build-and-push:
    # To run on the homelab runner instead: runs-on: gh-runner
    # (needs a runner registered to THIS repo, and jq installed on it)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # for SARIF upload to Security > Code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'          # don't fail here — the gate step below decides
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Annotate and gate on findings
        env:
          FAIL_ON_HIGH: 'false'   # start permissive; flip to 'true' once baseline is clean
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)

          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "::error title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10
          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")
            | "::warning title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10

          {
            echo "### Trivy scan: $CRIT critical, $HIGH high"
            echo
            echo "| Severity | ID | Package | Installed | Fixed |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "unfixed") |"' \
              trivy-results.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRIT" -gt 0 ]; then
            echo "Blocking push: $CRIT critical vulnerabilities found."
            exit 1
          fi
          if [ "$FAIL_ON_HIGH" = "true" ] && [ "$HIGH" -gt 0 ]; then
            echo "Blocking push: $HIGH high vulnerabilities found."
            exit 1
          fi
          echo "Gate passed: $CRIT critical, $HIGH high."

      # Optional but cheap: findings land in Security > Code scanning with history.
      - name: Re-scan as SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
