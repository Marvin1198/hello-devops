name: CI

on:
  push:
     branches:
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: marvin1198/hello-devops

jobs:
  # ------------------------------------------------------------------
  # 1. Unit tests + coverage.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------
  # 2. SonarQube — static analysis of the source.
  # ------------------------------------------------------------------
  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate coverage for Sonar
        run: pytest

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ------------------------------------------------------------------
  # 3. Snyk — SCA on Python dependencies.
  #    Overlaps with Trivy on purpose: different databases, different
  #    findings. Snyk carries its own curated advisories and reachability
  #    data; Trivy leans on public feeds. Two scanners is normal.
  # ------------------------------------------------------------------
  snyk:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        # Snyk resolves the real installed tree rather than guessing from
        # requirements.txt, which is what catches transitive dependencies.

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk dependency scan
        continue-on-error: true    # never fail here — the gate step decides
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --json-file-output=snyk.json \
            --sarif-file-output=snyk.sarif

      - name: Annotate and gate on Snyk findings
        env:
          FAIL_ON_HIGH: 'false'    # flip to 'true' once the baseline is clean
        run: |
          if [ ! -f snyk.json ]; then
            echo "No Snyk output produced — check the SNYK_TOKEN secret."
            exit 1
          fi

          # Snyk reports the same vulnerability once per dependency path,
          # so deduplicate by id before counting or you inflate the numbers.
          NORM='(if type=="array" then .[] else . end) | .vulnerabilities[]?'

          CRIT=$(jq "[ $NORM ] | unique_by(.id) | map(select(.severity==\"critical\")) | length" snyk.json)
          HIGH=$(jq "[ $NORM ] | unique_by(.id) | map(select(.severity==\"high\")) | length" snyk.json)

          jq -r "[ $NORM ] | unique_by(.id) | .[] | select(.severity==\"critical\")
            | \"::error title=\(.id)::\(.packageName) \(.version) — \(.title) — fixed in \(if (.fixedIn // []) | length > 0 then (.fixedIn | join(\", \")) else \"unfixed\" end)\"" \
            snyk.json | head -n 10
          jq -r "[ $NORM ] | unique_by(.id) | .[] | select(.severity==\"high\")
            | \"::warning title=\(.id)::\(.packageName) \(.version) — \(.title) — fixed in \(if (.fixedIn // []) | length > 0 then (.fixedIn | join(\", \")) else \"unfixed\" end)\"" \
            snyk.json | head -n 10

          {
            echo "### Snyk dependency scan: $CRIT critical, $HIGH high"
            echo
            echo "| Severity | ID | Package | Installed | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r "[ $NORM ] | unique_by(.id) | .[] | select(.severity==\"critical\" or .severity==\"high\")
              | \"| \(.severity) | \(.id) | \(.packageName) | \(.version) | \(if (.fixedIn // []) | length > 0 then (.fixedIn | join(\", \")) else \"unfixed\" end) |\"" \
              snyk.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRIT" -gt 0 ]; then
            echo "Blocking: $CRIT critical dependency vulnerabilities."
            exit 1
          fi
          if [ "$FAIL_ON_HIGH" = "true" ] && [ "$HIGH" -gt 0 ]; then
            echo "Blocking: $HIGH high dependency vulnerabilities."
            exit 1
          fi
          echo "Snyk gate passed: $CRIT critical, $HIGH high."

      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk        # keeps Snyk and Trivy results separate

  # ------------------------------------------------------------------
  # 4. Build -> scan -> gate -> push.
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Annotate and gate on findings
        env:
          FAIL_ON_HIGH: 'false'
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)

          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "::error title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10
          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")
            | "::warning title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10

          {
            echo "### Trivy image scan: $CRIT critical, $HIGH high"
            echo
            echo "| Severity | ID | Package | Installed | Fixed |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "unfixed") |"' \
              trivy-results.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRIT" -gt 0 ]; then
            echo "Blocking push: $CRIT critical vulnerabilities found."
            exit 1
          fi
          if [ "$FAIL_ON_HIGH" = "true" ] && [ "$HIGH" -gt 0 ]; then
            echo "Blocking push: $HIGH high vulnerabilities found."
            exit 1
          fi
          echo "Gate passed: $CRIT critical, $HIGH high."

      - name: Re-scan as SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
