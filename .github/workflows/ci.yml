name: CI

on:
  push:
    branches:
      - main            # merges to main -> full run, image IS pushed
      - 'feature/**'    # feature work    -> build + scan, image NOT pushed
  pull_request:
    branches: [main]    # PRs into main   -> build + scan, image NOT pushed
  workflow_dispatch:    # manual "Run workflow" button

# Cancels an in-flight run when you push again to the same branch, so
# five quick commits do not queue five full pipelines. main is excluded
# from cancellation - you never want a half-finished release run killed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: marvin1198/hello-devops

jobs:
  # ------------------------------------------------------------------
  # 1. Unit tests + coverage.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest

      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------
  # 2. SonarQube — static analysis of the source.
  # ------------------------------------------------------------------
  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate coverage for Sonar
        run: pytest

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ------------------------------------------------------------------
  # 3. CodeQL - SAST. Analyses YOUR source code for vulnerable patterns
  #    (injection, unsafe deserialisation, hardcoded secrets, etc).
  #
  #    This is a DIFFERENT question from Trivy's. CodeQL asks "did we
  #    write a bug?"; Trivy asks "did we ship a known-vulnerable
  #    package?". Neither substitutes for the other.
  #
  #    The `actions` language scans the workflow files themselves -
  #    script injection via untrusted PR titles is a real class of
  #    supply-chain attack.
  # ------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write   # to publish alerts
      contents: read
      actions: read
    strategy:
      fail-fast: false         # one language failing must not hide the other
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none     # Python is interpreted - nothing to compile
          queries: security-extended
          # default          = high confidence, low noise
          # security-extended = more queries, more false positives
          # security-and-quality = adds maintainability checks

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Distinct category per language, or the second upload
          # overwrites the first - same rule as the SARIF uploads below.

  # ------------------------------------------------------------------
  # 3. Security gates -> build -> image scan -> push.
  #    Everything security-related happens BEFORE the single push step,
  #    so a failing gate means nothing reaches the registry.
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Annotate and gate on findings
        env:
          FAIL_ON_HIGH: 'false'
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)

          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "::error title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10
          jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")
            | "::warning title=\(.VulnerabilityID)::\(.PkgName) \(.InstalledVersion) — fixed in \(.FixedVersion // "unfixed")"' \
            trivy-results.json | head -n 10

          {
            echo "### Trivy image scan: $CRIT critical, $HIGH high"
            echo
            echo "| Severity | ID | Package | Installed | Fixed |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")
              | "| \(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "unfixed") |"' \
              trivy-results.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRIT" -gt 0 ]; then
            echo "Blocking push: $CRIT critical vulnerabilities found."
            exit 1
          fi
          if [ "$FAIL_ON_HIGH" = "true" ] && [ "$HIGH" -gt 0 ]; then
            echo "Blocking push: $HIGH high vulnerabilities found."
            exit 1
          fi
          echo "Gate passed: $CRIT critical, $HIGH high."

      - name: Re-scan as SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
